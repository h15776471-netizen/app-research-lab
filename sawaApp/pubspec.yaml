name: sawa
description: >
  SAWA — premium Iraqi event & wedding platform (Baghdad first): structured
  provider catalogue, guest contact requests, rule-based event planner and a
  provider portal on Supabase (Auth + RLS + Storage).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management — Riverpod (Technical Architecture §2/§11).
  flutter_riverpod: ^2.5.1

  # Navigation — go_router (Technical Architecture §2).
  go_router: ^14.2.2

  # Cairo font — Design Handoff §6, no manual font files.
  google_fonts: ^6.2.1

  # Contact-request writes only (insert-only) — Technical Architecture §8.
  supabase_flutter: ^2.5.9

  # Kept as a ready dependency for a post-hackathon swap to remote provider
  # images. NOT used for the MVP demo (local assets only) — Technical
  # Architecture §13.
  cached_network_image: ^3.3.1

  # Instagram link launcher — ProviderDetailsScreen (Master Spec §36 point 4).
  url_launcher: ^6.3.0
  image_picker: ^1.2.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/data/catalog.json
    - assets/images/providers/flowers_fayrouz/
    - assets/images/providers/flowers_laflamme/
    - assets/images/providers/flowers_lucci/
    - assets/images/providers/flowers_ward/
    - assets/images/providers/hall_asawer/
    - assets/images/providers/hall_jadriya/
    - assets/images/providers/hall_malika/
    - assets/images/providers/hall_qasr_rotana/
    - assets/images/providers/hall_weam/
    - assets/images/providers/photo_asmer/
    - assets/images/providers/photo_mariam/
    - assets/images/providers/photo_marwa/
    - assets/images/providers/photo_shot/
    - assets/images/providers/photo_tabarek/
